
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barangay e-Request System</title>

<!-- QR CODE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
/* =========================================================
   BARANGAY E-REQUEST SYSTEM
   ALL-IN-ONE PROTOTYPE
   HTML + CSS + JAVASCRIPT
   ========================================================= */

:root{
  --primary:#b91c1c;
  --primary2:#ef4444;
  --primary3:#7f1d1d;
  --gold:#dc2626;
  --gold2:#b91c1c;

  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --border:#dfe5ee;

  --success:#dc2626;
  --success-bg:#fee2e2;

  --warning:#b91c1c;
  --warning-bg:#fee2e2;

  --danger:#b91c1c;
  --danger-bg:#fee2e2;

  --info:#dc2626;
  --info-bg:#fee2e2;

  --shadow:0 12px 35px rgba(15,35,75,.10);
  --radius:18px;
}

html[data-theme="dark"]{
  --bg:#0b1220;
  --card:#111b2e;
  --text:#f5f7fb;
  --muted:#aab5c7;
  --border:#273550;

  --success-bg:#401d1d;
  --warning-bg:#401d1d;
  --danger-bg:#401d1d;
  --info-bg:#401d1d;

  --shadow:0 12px 35px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:var(--card);
  border-bottom:1px solid var(--border);
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.navbar{
  max-width:1250px;
  margin:auto;
  min-height:76px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:230px;
}

.brand-logo{
  width:48px;
  height:48px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:23px;
  font-weight:900;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 8px 20px rgba(185,28,28,.25);
}

.brand-title{
  font-weight:900;
  font-size:17px;
}

.brand-sub{
  color:var(--muted);
  font-size:11px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.nav-links button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 11px;
  border-radius:10px;
  font-weight:700;
}

.nav-links button:hover{
  background:var(--info-bg);
  color:var(--primary);
}

.menu-btn{
  display:none;
}

/* =========================================================
   MAIN
   ========================================================= */

.container{
  width:min(1250px,calc(100% - 30px));
  margin:auto;
}

main{
  min-height:calc(100vh - 160px);
  padding:35px 0 60px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.btn{
  border:0;
  border-radius:11px;
  padding:11px 16px;
  font-weight:800;
  transition:.2s;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.btn-secondary{
  color:var(--text);
  background:var(--card);
  border:1px solid var(--border);
}

.btn-gold{
  color:#111;
  background:var(--gold);
}

.btn-success{
  color:white;
  background:var(--success);
}

.btn-danger{
  color:white;
  background:var(--danger);
}

.btn-info{
  color:white;
  background:var(--info);
}

.btn-sm{
  padding:7px 10px;
  font-size:12px;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
  border-radius:26px;
  padding:50px;
  color:white;
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(circle at 85% 15%,rgba(239,68,68,.25),transparent 25%),
    linear-gradient(135deg,#7f1d1d,#ef4444);
  box-shadow:var(--shadow);
}

.hero:after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  right:-100px;
  bottom:-150px;
}

.hero-content{
  position:relative;
  z-index:1;
  max-width:750px;
}

.badge{
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  background:rgba(255,255,255,.14);
  margin-bottom:15px;
}

.hero h1{
  font-size:clamp(32px,5vw,58px);
  line-height:1.05;
  margin-bottom:15px;
}

.hero p{
  max-width:680px;
  color:#fee2e2;
  font-size:16px;
  margin-bottom:25px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

/* =========================================================
   CARDS
   ========================================================= */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.card-body{
  padding:22px;
}

.section{
  margin-top:30px;
}

.section-title{
  margin-bottom:15px;
}

.section-title h2{
  font-size:25px;
}

.section-title p{
  color:var(--muted);
  font-size:14px;
}

/* =========================================================
   DOCUMENT CARDS
   ========================================================= */

.doc-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.doc-card{
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  transition:.2s;
}

.doc-card:hover{
  transform:translateY(-3px);
  border-color:var(--primary2);
  box-shadow:var(--shadow);
}

.doc-icon{
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:var(--info-bg);
  color:var(--primary2);
  font-size:20px;
  margin-bottom:13px;
}

.doc-card h3{
  font-size:16px;
  margin-bottom:6px;
}

.doc-card p{
  color:var(--muted);
  font-size:13px;
  min-height:40px;
}

.doc-meta{
  display:flex;
  justify-content:space-between;
  margin:14px 0;
  font-size:12px;
  color:var(--muted);
}

.price{
  font-weight:900;
  color:var(--primary);
}

/* =========================================================
   PORTAL CARDS
   ========================================================= */

.portal-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.portal{
  padding:25px;
  border-radius:18px;
  border:1px solid var(--border);
  background:var(--card);
}

.portal h3{
  margin-bottom:7px;
}

.portal p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:15px;
}

/* =========================================================
   FORMS
   ========================================================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:800;
}

input,
select,
textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary2);
  box-shadow:0 0 0 3px rgba(220,38,38,.12);
}

textarea{
  resize:vertical;
  min-height:110px;
}

/* =========================================================
   STEPS
   ========================================================= */

.steps{
  display:flex;
  gap:8px;
  margin-bottom:25px;
}

.step{
  flex:1;
  padding:10px;
  text-align:center;
  border-radius:10px;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
  font-weight:900;
}

.step.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

.step.done{
  background:var(--success-bg);
  color:var(--success);
  border-color:transparent;
}

/* =========================================================
   INFO BOX
   ========================================================= */

.notice{
  padding:14px;
  border-radius:12px;
  background:var(--info-bg);
  color:var(--info);
  font-size:13px;
  margin-bottom:18px;
}

.notice.warning{
  background:var(--warning-bg);
  color:var(--warning);
}

.notice.danger{
  background:var(--danger-bg);
  color:var(--danger);
}

/* =========================================================
   STATUS
   ========================================================= */

.status{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
}

.status-Pending{
  color:var(--warning);
  background:var(--warning-bg);
}

.status-Processing{
  color:var(--info);
  background:var(--info-bg);
}

.status-Ready{
  color:var(--success);
  background:var(--success-bg);
}

.status-Completed{
  color:var(--success);
  background:var(--success-bg);
}

.status-Rejected{
  color:var(--danger);
  background:var(--danger-bg);
}

/* =========================================================
   TRACKING
   ========================================================= */

.track-box{
  max-width:650px;
  margin:20px auto;
}

.track-result{
  margin-top:20px;
}

.timeline{
  position:relative;
  margin:20px 0;
  padding-left:28px;
}

.timeline:before{
  content:"";
  position:absolute;
  left:8px;
  top:4px;
  bottom:4px;
  width:2px;
  background:var(--border);
}

.timeline-item{
  position:relative;
  padding:0 0 25px;
}

.timeline-dot{
  position:absolute;
  left:-27px;
  top:3px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--border);
  border:3px solid var(--card);
  box-shadow:0 0 0 2px var(--border);
}

.timeline-item.active .timeline-dot{
  background:var(--primary2);
  box-shadow:0 0 0 2px var(--primary2);
}

.timeline-item h4{
  font-size:14px;
}

.timeline-item p{
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   ADMIN
   ========================================================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.stat{
  padding:17px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.stat-value{
  font-size:27px;
  font-weight:900;
  margin-top:4px;
}

.admin-toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.toolbar-left,
.toolbar-right{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  padding:12px;
  text-align:left;
  border-bottom:1px solid var(--border);
  font-size:12px;
}

th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

tr:hover td{
  background:rgba(220,38,38,.04);
}

/* =========================================================
   MOBILE ADMIN REQUEST CARDS
   ========================================================= */

.admin-mobile-list{
  display:none;
}

.admin-request-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 6px 20px rgba(15,35,75,.07);
}

.admin-request-card:last-child{
  margin-bottom:0;
}

.admin-request-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.admin-request-id{
  font-size:14px;
  font-weight:900;
  word-break:break-word;
}

.admin-request-date{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.admin-request-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.admin-info-item{
  padding:10px;
  border-radius:10px;
  background:var(--bg);
  min-width:0;
}

.admin-info-label{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.3px;
  margin-bottom:3px;
}

.admin-info-value{
  font-size:12px;
  font-weight:700;
  word-break:break-word;
}

.admin-request-action{
  display:flex;
  gap:8px;
}

.admin-request-action .btn{
  width:100%;
}

.mobile-status{
  flex-shrink:0;
}

/* =========================================================
   LOGIN
   ========================================================= */

.login-wrap{
  max-width:460px;
  margin:50px auto;
}

.login-card{
  padding:30px;
}

.login-logo{
  text-align:center;
  margin-bottom:25px;
}

.login-logo .brand-logo{
  margin:auto;
}

/* =========================================================
   QR
   ========================================================= */

.qr-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.qr-box{
  text-align:center;
  padding:25px;
}

.qr-container{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:20px auto;
  min-height:260px;
}

.qr-container img{
  max-width:100%;
}

.url-box{
  word-break:break-all;
  font-size:12px;
  padding:12px;
  background:var(--bg);
  border-radius:10px;
  color:var(--muted);
}

/* =========================================================
   MODAL
   ========================================================= */

.modal{
  position:fixed;
  inset:0;
  z-index:3000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.55);
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:20px;
  border:1px solid var(--border);
  box-shadow:0 20px 70px rgba(0,0,0,.3);
}

.modal-header{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-body{
  padding:20px;
}

.modal-close{
  border:0;
  background:transparent;
  font-size:22px;
  color:var(--muted);
}

/* =========================================================
   TOAST
   ========================================================= */

#toastBox{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:5000;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  min-width:260px;
  max-width:360px;
  padding:13px 15px;
  color:white;
  background:#172033;
  border-radius:12px;
  box-shadow:var(--shadow);
  font-size:13px;
  animation:toastIn .2s ease;
}

.toast.success{
  background:var(--success);
}

.toast.error{
  background:var(--danger);
}

.toast.info{
  background:var(--primary);
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:45px;
  margin-bottom:10px;
}

/* =========================================================
   FOOTER
   ========================================================= */

footer{
  background:var(--primary3);
  color:#fee2e2;
  padding:28px 20px;
}

.footer-inner{
  width:min(1250px,100%);
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

.footer-inner small{
  color:#fca5a5;
}

/* =========================================================
   PRINT
   ========================================================= */

.print-only{
  display:none;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:950px){

  .doc-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .stats-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .qr-layout{
    grid-template-columns:1fr;
  }

}

@media(max-width:750px){

  .navbar{
    flex-wrap:wrap;
  }

  .menu-btn{
    display:block;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:8px 11px;
    border-radius:9px;
  }

  .nav-links{
    width:100%;
    display:none;
    flex-direction:column;
    align-items:stretch;
  }

  .nav-links.show{
    display:flex;
  }

  .nav-links button{
    text-align:left;
  }

  .hero{
    padding:32px 23px;
  }

  .hero h1{
    font-size:36px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .portal-grid,
  .doc-grid{
    grid-template-columns:1fr;
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  /* =======================================================
     MOBILE ADMIN REQUESTS
     ======================================================= */

  .table-wrap{
    display:none;
  }

  .admin-mobile-list{
    display:block;
  }

  .admin-toolbar{
    align-items:stretch;
  }

  .toolbar-left,
  .toolbar-right{
    width:100%;
  }

  .toolbar-left input,
  .toolbar-left select{
    width:100%;
    min-width:0!important;
  }

  .toolbar-left{
    display:grid;
    grid-template-columns:1fr;
  }

  .toolbar-right{
    display:grid;
    grid-template-columns:repeat(3,1fr);
  }

  .toolbar-right .btn{
    width:100%;
  }

  .admin-request-info{
    grid-template-columns:1fr;
  }

  .admin-request-top{
    align-items:flex-start;
  }

  .admin-request-action{
    flex-direction:column;
  }

}

@media(max-width:480px){

  .container{
    width:min(100% - 20px,1250px);
  }

  main{
    padding-top:20px;
  }

  .brand-title{
    font-size:14px;
  }

  .brand-logo{
    width:42px;
    height:42px;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
  }

  .btn{
    width:100%;
  }

  .hero-actions{
    flex-direction:column;
  }

  .toolbar-right{
    grid-template-columns:1fr;
  }

  .admin-request-card{
    padding:14px;
  }

  .admin-request-top{
    flex-direction:column;
  }

  .mobile-status{
    align-self:flex-start;
  }

}

/* =========================================================
   PRINT STYLES
   ========================================================= */

@media print{

  header,
  footer,
  .no-print,
  .modal,
  #toastBox{
    display:none!important;
  }

  body{
    background:white;
    color:black;
  }

  .print-only{
    display:block;
  }

  main{
    padding:0;
  }

  .card{
    box-shadow:none;
    border:1px solid #ddd;
  }
}
</style>

      "1:406443499005:web:5f78fda2f792e6e0f90d94"

  try{

</script>

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const DB_KEY = "barangay_requests_v1";

const THEME_KEY = "barangay_theme";

const RECENT_KEY = "barangay_recent_tracks";

const ADMIN_SESSION =
  "barangay_admin_session";

const ADMIN_USER =
  "admin";

const ADMIN_PASS =
  "barangay123";


/* =========================================================
   FIREBASE STATE
   ========================================================= */

let firestoreRequests = [];

let firestoreLoaded = false;

let firestoreUnsubscribe = null;

let firebaseStarting = false;


/* =========================================================
   WAIT FOR FIREBASE
   ========================================================= */

function waitForFirebase(){

  return new Promise((resolve,reject)=>{

    if(
      window.firebaseReady &&
      window.firebaseDB
    ){

      resolve(true);

      return;
    }


    if(window.firebaseError){

      reject(
        window.firebaseError
      );

      return;
    }


    let attempts = 0;


    const timer =
      setInterval(()=>{

        attempts++;


        if(
          window.firebaseReady &&
          window.firebaseDB
        ){

          clearInterval(timer);

          resolve(true);

          return;
        }


        if(window.firebaseError){

          clearInterval(timer);

          reject(
            window.firebaseError
          );

          return;
        }


        if(attempts >= 100){

          clearInterval(timer);

          reject(
            new Error(
              "Firebase failed to initialize."
            )
          );

        }

      },100);

  });

}


/* =========================================================
   FIREBASE ERROR
   ========================================================= */

function firebaseErrorMessage(error){

  console.error(
    "Firebase error:",
    error
  );


  if(
    error &&
    error.code ===
    "permission-denied"
  ){

    return (
      "Firebase permission denied. " +
      "Check Firestore Rules."
    );

  }


  if(
    error &&
    error.code ===
    "failed-precondition"
  ){

    return (
      "Firestore is not ready. " +
      "Check Firebase Firestore Database."
    );

  }


  if(
    error &&
    error.code ===
    "unavailable"
  ){

    return (
      "Firebase is unavailable. " +
      "Check your internet connection."
    );

  }


  return (
    error?.message ||
    "Firebase operation failed."
  );

}


/* =========================================================
   NORMALIZE FIREBASE REQUEST
   =========================================================
   
   IMPORTANT:
   Old Firebase documents may not have a status.
   Those documents are automatically treated as Pending.
   
   New requests are also guaranteed to have Pending.
   ========================================================= */

function normalizeRequest(request){

  if(!request){

    return request;

  }


  const normalized = {

    ...request

  };


  /*
    If status is missing, null, undefined,
    or empty string, force Pending.
  */

  if(
    !normalized.status ||
    String(
      normalized.status
    ).trim() === ""
  ){

    normalized.status =
      "Pending";

  }


  /*
    Make sure old records still have
    an array for timeline.
  */

  if(
    !Array.isArray(
      normalized.timeline
    )
  ){

    normalized.timeline = [

      {

        status:
          "Pending",

        date:
          normalized.createdAt ||
          new Date().toISOString(),

        note:
          "Request status was automatically set to Pending."

      }

    ];

  }


  return normalized;

}


/* =========================================================
   FIREBASE REALTIME DATABASE LISTENER
   ========================================================= */

async function initializeFirestore(){

  if(firebaseStarting){
    return;
  }

  firebaseStarting = true;

  try{

    await waitForFirebase();

    if(firestoreUnsubscribe){
      firestoreUnsubscribe();
      firestoreUnsubscribe = null;
    }

    const requestsRef =
      window.firebaseCollection(
        window.firebaseDB,
        "requests"
      );

    firestoreUnsubscribe =
      window.firebaseOnSnapshot(
        requestsRef,
        {
          includeMetadataChanges:true
        },
        snapshot=>{

          firestoreRequests =
            snapshot.docs.map(
              firebaseDocSnapshot=>{

                const rawData =
                  firebaseDocSnapshot.data();

                return normalizeRequest({

                  firestoreId:
                    firebaseDocSnapshot.id,

                  ...rawData

                });

              }
            );

          firestoreRequests.sort(
            (a,b)=>
              new Date(
                b.createdAt || 0
              ).getTime() -
              new Date(
                a.createdAt || 0
              ).getTime()
          );

          firestoreLoaded = true;

          /*
            Re-render the admin dashboard EVERY TIME
            Firestore receives a change. This is what
            makes a request submitted from a phone
            appear automatically on the admin computer.
          */
          const hash =
            location.hash || "#/home";

          if(
            hash === "#/admin/dashboard" &&
            isAdmin()
          ){
            renderAdminDashboard();
          }

          /*
            Keep tracking/success pages updated too.
          */
          if(hash.startsWith("#/track?")){

            const params =
              new URLSearchParams(
                hash.split("?")[1]
              );

            const id =
              params.get("id") || "";

            if(id){

              const request =
                getRequest(id);

              const result =
                $("trackResult");

              if(request && result){
                renderTrackResult(request);
              }

            }

          }

          if(hash.startsWith("#/success?")){

            const params =
              new URLSearchParams(
                hash.split("?")[1]
              );

            const id =
              params.get("id");

            if(id){

              const request =
                getRequest(id);

              if(request){
                renderSuccessFromData(request);
              }

            }

          }

        },
        error=>{

          console.error(
            "Firestore realtime listener error:",
            error
          );

          firestoreLoaded = true;

          toast(
            firebaseErrorMessage(error),
            "error"
          );

        }
      );

  }catch(error){

    console.error(
      "Firestore startup error:",
      error
    );

    firestoreLoaded = true;

    toast(
      firebaseErrorMessage(error),
      "error"
    );

  }finally{

    firebaseStarting = false;

  }

}

/* =========================================================
   DATABASE / FIRESTORE
   ========================================================= */

function loadRequests(){

  return firestoreRequests.map(
    request =>
      normalizeRequest(
        request
      )
  );

}


/* =========================================================
   FIRESTORE SAVE REQUESTS
   ========================================================= */

async function saveRequests(requests){

  await waitForFirebase();


  const incoming =
    Array.isArray(requests)
      ? requests
      : [];


  const current =
    [...firestoreRequests];


  const currentById =
    new Map(
      current.map(
        r=>[r.id,r]
      )
    );


  const incomingIds =
    new Set(
      incoming.map(
        r=>r.id
      )
    );


  /*
    Delete records that are no longer
    included in the incoming array.
  */

  for(
    const currentRequest of current
  ){

    if(
      currentRequest.firestoreId &&
      !incomingIds.has(
        currentRequest.id
      )
    ){

      await window.firebaseDeleteDoc(

        window.firebaseDoc(
          window.firebaseDB,
          "requests",
          currentRequest.firestoreId
        )

      );

    }

  }


  /*
    Add or update incoming records.
  */

  for(
    const originalRequest of incoming
  ){

    /*
      Normalize before saving.
      Missing status becomes Pending.
    */

    const request =
      normalizeRequest(
        originalRequest
      );


    const cleanRequest = {
      ...request
    };


    delete cleanRequest.firestoreId;


    const existing =
      currentById.get(
        request.id
      );


    if(
      existing &&
      existing.firestoreId
    ){

      await window.firebaseUpdateDoc(

        window.firebaseDoc(
          window.firebaseDB,
          "requests",
          existing.firestoreId
        ),

        cleanRequest

      );

    }else{

      await window.firebaseAddDoc(

        window.firebaseCollection(
          window.firebaseDB,
          "requests"
        ),

        cleanRequest

      );

    }

  }


  /*
    Realtime listener will update
    firestoreRequests automatically.
  */

}


/* =========================================================
   GENERATE REQUEST ID
   ========================================================= */

function genRequestId(){

  const now =
    new Date();


  const year =
    now.getFullYear();


  const random =
    Math.floor(
      100000 +
      Math.random()*900000
    );


  return `BRGY-${year}-${random}`;

}


/* =========================================================
   ADD REQUEST
   ========================================================= */

async function addRequest(data){

  await waitForFirebase();


  const now =
    new Date().toISOString();


  /*
    IMPORTANT:
    Every NEW request is ALWAYS Pending.
    
    Even if data contains status:"Processing",
    status:"Ready", etc., the final status here
    is forced to Pending.
  */

  const request = {

    id:
      genRequestId(),

    ...data,

    createdAt:
      now,

    updatedAt:
      now,

    status:
      "Pending",

    adminNotes:
      "",

    timeline:[
      {
        status:
          "Pending",

        date:
          now,

        note:
          "Request submitted successfully."
      }
    ]

  };


  const cleanRequest =
    {
      ...request
    };


  delete cleanRequest.firestoreId;


  const docRef =
    await window.firebaseAddDoc(

      window.firebaseCollection(
        window.firebaseDB,
        "requests"
      ),

      cleanRequest

    );


  /*
    Add immediately to local memory.
    The realtime listener will also sync it.
  */

  const localRequest = {

    ...request,

    firestoreId:
      docRef.id

  };


  firestoreRequests =
    [
      localRequest,
      ...firestoreRequests.filter(
        r=>r.id !== localRequest.id
      )
    ];


  firestoreRequests.sort(
    (a,b)=>
      new Date(
        b.createdAt
      ).getTime() -
      new Date(
        a.createdAt
      ).getTime()
  );


  return localRequest;

}


/* =========================================================
   GET REQUEST
   ========================================================= */

function getRequest(id){

  if(!id){
    return null;
  }


  const request =
    firestoreRequests.find(

      r =>
        String(r.id || "")
          .toUpperCase() ===
        String(id || "")
          .toUpperCase()

    ) || null;


  /*
    Normalize again when retrieving.
    This protects old records that don't
    have a status.
  */

  return normalizeRequest(
    request
  );

}


/* =========================================================
   UPDATE REQUEST
   ========================================================= */

async function updateRequest(id,changes){

  await waitForFirebase();


  const request =
    getRequest(id);


  if(!request){

    return null;

  }


  if(!request.firestoreId){

    throw new Error(
      "Firestore document ID not found."
    );

  }


  const updatedChanges = {

    ...changes,

    /*
      If current status is missing,
      preserve it as Pending.
    */

    status:
      changes.status ||
      request.status ||
      "Pending",

    updatedAt:
      new Date().toISOString()

  };


  const updated = {

    ...updatedChanges

  };


  await window.firebaseUpdateDoc(

    window.firebaseDoc(
      window.firebaseDB,
      "requests",
      request.firestoreId
    ),

    updated

  );


  const index =
    firestoreRequests.findIndex(
      r=>r.id === id
    );


  if(index !== -1){

    firestoreRequests[index] =
      normalizeRequest({

        ...firestoreRequests[index],

        ...updated

      });

  }


  return firestoreRequests[index];

}


/* =========================================================
   DELETE REQUEST
   ========================================================= */

async function deleteRequest(id){

  await waitForFirebase();


  const request =
    getRequest(id);


  if(!request){

    return false;

  }


  if(request.firestoreId){

    await window.firebaseDeleteDoc(

      window.firebaseDoc(
        window.firebaseDB,
        "requests",
        request.firestoreId
      )

    );

  }


  firestoreRequests =
    firestoreRequests.filter(
      r=>r.id !== id
    );


  return true;

}


/* =========================================================
   UPDATE STATUS
   ========================================================= */

async function updateStatus(
  id,
  newStatus,
  note=""
){

  const request =
    getRequest(id);


  if(!request){

    return null;

  }


  const timeline =
    Array.isArray(
      request.timeline
    )
      ? [
          ...request.timeline
        ]
      : [];


  timeline.push({

    status:
      newStatus,

    date:
      new Date().toISOString(),

    note:
      note.trim() ||
      `Request status changed to ${newStatus}.`

  });


  const changes = {

    status:
      newStatus,

    timeline:
      timeline,

    adminNotes:
      note.trim() ||
      request.adminNotes ||
      "",

    updatedAt:
      new Date().toISOString()

  };


  return await updateRequest(
    id,
    changes
  );

}


/* =========================================================
   WAIT FOR FIRESTORE DATA
   ========================================================= */

async function waitForFirestoreData(){

  await waitForFirebase();


  if(firestoreLoaded){

    return true;

  }


  return new Promise((resolve)=>{

    let attempts = 0;


    const timer =
      setInterval(()=>{

        attempts++;


        if(firestoreLoaded){

          clearInterval(timer);

          resolve(true);

          return;

        }


        if(attempts >= 100){

          clearInterval(timer);

          resolve(false);

        }

      },100);

  });

}


/* =========================================================
   RECENT TRACKING
   ========================================================= */

function saveRecentTrack(id){

  let list = [];


  try{

    list =
      JSON.parse(
        localStorage.getItem(
          RECENT_KEY
        ) || "[]"
      );

  }catch{

    list = [];

  }


  list =
    list.filter(
      x=>x !== id
    );


  list.unshift(id);


  list =
    list.slice(0,8);


  localStorage.setItem(

    RECENT_KEY,

    JSON.stringify(list)

  );

}

/* =========================================================

/* =========================================================
   SUBMIT REQUEST
   ========================================================= */

async function submitRequest(){

  /*
    IMPORTANT:
    The resident's phone must have an active
    Firestore connection before submitting.
  */
  try{
    await waitForFirebase();
  }catch(error){
    console.error(error);
    toast(
      "Hindi makakonekta sa database. Pakicheck ang internet at Firebase.",
      "error"
    );
    return;
  }

  const selected =
    docByCode(
      formState.docCode
    );


  if(!selected){

    toast(
      "Invalid document.",
      "error"
    );

    return;

  }


  const total =
    Number(
      selected.price || 0
    ) *
    Number(
      formState.copies || 1
    );


  try{

    toast(
      "Submitting request...",
      "info"
    );


    const request =
      await addRequest({

        documentCode:
          selected.code,

        documentName:
          selected.name,

        documentPrice:
          selected.price,

        fullName:
          formState.fullName,

        birthdate:
          formState.birthdate,

        address:
          formState.address,

        contact:
          formState.contact,

        email:
          formState.email,

        copies:
          formState.copies,

        purpose:
          formState.purpose,

        notes:
          formState.notes,

        urgent:
          formState.urgent,

        totalFee:
          total

      });


    saveRecentTrack(
      request.id
    );


    go(
      "#/success?id=" +
      encodeURIComponent(
        request.id
      )
    );


  }catch(error){

    console.error(error);


    toast(
      firebaseErrorMessage(error),
      "error"
    );

  }

}

function buildAppUrl(hash){

  const base =
    location.href
      .split("#")[0]
      .split("?")[0];


  return base + hash;

}


function normalizeBaseUrl(value){

  let url =
    value.trim();


  if(!url){

    return "";

  }


  if(
    !/^https?:\/\//i.test(url) &&
    !/^file:/i.test(url)
  ){

    url =
      "https://" +
      url;

  }


  return url
    .split("#")[0]
    .split("?")[0];

}


function makeRequestUrl(base){

  const clean =
    normalizeBaseUrl(base);


  if(!clean){

    return "";

  }


  return clean +
    "#/request";

}


function generateQR(
  elementId,
  text,
  size=250
){
  const container = $(elementId);
  if(!container || !text) return false;

  container.innerHTML = "";

  // Main method: use the locally included QRCodeJS library.
  if(typeof QRCode !== "undefined"){
    try {
      new QRCode(container, {
        text: text,
        width: size,
        height: size,
        colorDark: "#111111",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
      return true;
    } catch(error) {
      console.warn("QRCodeJS failed; using fallback image.", error);
    }
  }

  // Fallback: still display a scannable QR if the JavaScript CDN is blocked.
  const img = document.createElement("img");
  img.alt = "Resident request QR code";
  img.width = size;
  img.height = size;
  img.style.cssText = "display:block;max-width:100%;height:auto;margin:0 auto;background:#fff;padding:8px;";
  img.src = "https://api.qrserver.com/v1/create-qr-code/?size=" + size + "x" + size + "&format=png&data=" + encodeURIComponent(text);
  img.onerror = function(){
    container.innerHTML = '<p style="color:var(--danger)">Hindi ma-load ang QR code. Siguraduhing may internet connection at subukan ulit.</p>';
  };
  container.appendChild(img);
  return true;
}


function generateResidentQR(){

    $("qrUrl").value.trim();

    makeRequestUrl(

    );

  $("qrDisplayUrl").textContent =

    250
  );

  if(generated){

      "success"
    );
  } else {
    toast(
      "Hindi nagawa ang QR code. I-check ang URL at subukan ulit.",
      "error"
    );
  }

}

  let requests =
    loadRequests().map(
      normalizeRequest
    );


  const search =
    adminFilter.search
      .trim()
      .toLowerCase();


  if(search){

    requests =
      requests.filter(
        r=>{

          return [

            r.id,

            r.fullName,

            r.documentName,

            r.contact,

            r.address,

            r.purpose,

            r.status ||
              "Pending"

          ]
          .join(" ")
          .toLowerCase()
          .includes(search);

        }
      );

  }


  if(
    adminFilter.status !==
    "All"
  ){

    requests =
      requests.filter(

          (
            r.status ||
            "Pending"

          adminFilter.status
      );

  }


  requests.sort(
    (a,b)=>{

      const aTime =
        new Date(
          a.createdAt || 0

        ).getTime();

        : aTime-bTime;

/* =========================================================
   SAVE ADMIN CHANGES
   ========================================================= */

async function saveAdminChanges(id){

  const status =
    $("adminStatus").value ||
    "Pending";


  const notes =
    $("adminNotes").value.trim();


  const request =
    getRequest(id);


  if(!request){

    return;

  }


  try{

    if(
      status !==
      (
        request.status ||
        "Pending"
      )
    ){

      await updateStatus(
        id,
        status,
        notes
      );

    }else{

      await updateRequest(
        id,
        {
          adminNotes:
            notes,

          status:
            request.status ||
            "Pending"
        }
      );

    }


    closeModal();


    toast(
      "Request updated successfully.",
      "success"
    );


    renderAdminDashboard();


  }catch(error){

    console.error(error);


    toast(
      firebaseErrorMessage(error),
      "error"
    );

  }

}

async function confirmDeleteRequest(id){

      id

    toast(

    );


    renderAdminDashboard();


  }catch(error){

    toast(
      firebaseErrorMessage(error),

    );

  }

}

/* =========================================================
   IMPORT JSON
   ========================================================= */

async function importJSON(event){

  const file =
    event.target.files?.[0];


  if(!file){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    async function(){

      try{

        const data =
          JSON.parse(
            reader.result
          );


        if(
          !Array.isArray(data)
        ){

          throw new Error(
            "Invalid format"
          );

        }


        await waitForFirestoreData();


        let imported =
          0;


        for(
          const original
          of data
        ){

          if(
            !original ||
            !original.id
          ){

            continue;

          }


          /*
            Normalize imported data.
            Missing status becomes Pending.
          */

          const normalized =
            normalizeRequest(
              original
            );


          const clean = {

            ...normalized

          };


          delete clean.firestoreId;


          /*
            If an ID already exists,
            update that request instead
            of creating a duplicate.
          */

          const existing =
            getRequest(
              clean.id
            );


          if(
            existing &&
            existing.firestoreId
          ){

            await window.firebaseUpdateDoc(

              window.firebaseDoc(
                window.firebaseDB,
                "requests",
                existing.firestoreId
              ),

              clean

            );

          }else{

            await window.firebaseAddDoc(

              window.firebaseCollection(
                window.firebaseDB,
                "requests"
              ),

              clean

            );

          }


          imported++;

        }


        toast(
          `${imported} requests imported.`,
          "success"
        );


        renderAdminDashboard();


      }catch(error){

        console.error(error);


        toast(
          "Invalid JSON backup file.",
          "error"
        );

      }finally{

        event.target.value =
          "";

      }

    };


  reader.readAsText(file);

}


function downloadFile(
  content,
  filename,
  type
){

  const blob =
    new Blob(
      [content],
      {
        type:type
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  URL.revokeObjectURL(
    url
  );

}

/* =========================================================
   COPY
   ========================================================= */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(
      text
    );


    toast(
      "Copied to clipboard.",
      "success"
    );


  }catch{

    toast(
      "Unable to copy automatically.",
      "error"
    );

  }

}


/* =========================================================
   ROUTER
   ========================================================= */

async function router(){

  const hash =
    location.hash ||
    "#/home";


  if(
    hash ===
    "#/home"
  ){

    renderHome();

    return;

  }


  if(
    hash ===
    "#/request"
  ){

    renderRequest();

    return;

  }


  if(
    hash ===
    "#/track"
  ){

    renderTrack();

    return;

  }


  if(
    hash.startsWith(
      "#/track?"
    )
  ){

    const params =
      new URLSearchParams(
        hash.split("?")[1]
      );


    renderTrack(
      params.get("id") ||
      ""
    );


    return;

  }


  if(
    hash ===
    "#/qr"
  ){

    renderQR();

    return;

  }


  if(
    hash ===
    "#/admin"
  ){

    renderAdminLogin();

    return;

  }


  if(
    hash ===
    "#/admin/dashboard"
  ){

    await renderAdminDashboard();

    return;

  }


  if(
    hash.startsWith(
      "#/success?"
    )
  ){

    const params =
      new URLSearchParams(
        hash.split("?")[1]
      );


    renderSuccess(
      params.get("id")
    );


    return;

  }


  go("#/home");

}

/* =========================================================
   BASIC HELPERS
   ========================================================= */

function $(id){

  return document.getElementById(
    id
  );

}


function go(hash){

  location.hash =
    hash;

  closeMenu();

}


function toggleMenu(){

  $("navLinks")
    .classList
    .toggle("show");

}


function closeMenu(){

  $("navLinks")
    ?.classList
    .remove("show");

}


function esc(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


function peso(value){

  const amount =
    Number(
      value || 0
    );


  if(
    amount === 0
  ){

    return "FREE";

  }


  return "₱" +
    amount.toLocaleString(
      "en-PH",
      {

        minimumFractionDigits:
          2,

        maximumFractionDigits:
          2

      }
    );

}


function fmtDate(date){

  if(!date){

    return "—";

  }


  return new Date(
    date
  ).toLocaleString(
    "en-PH",
    {

      dateStyle:
        "medium",

      timeStyle:
        "short"

    }
  );

}


function fmtDateOnly(date){

  if(!date){

    return "—";

  }


  return new Date(
    date
  ).toLocaleDateString(
    "en-PH",
    {

      year:
        "numeric",

      month:
        "long",

      day:
        "numeric"

    }
  );

}


function docByCode(code){

  return DOCUMENTS.find(
    d =>
      d.code === code
  );

}


function toast(
  message,
  type="info"
){

  const box =
    $("toastBox");


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "toast " +
    type;


  el.textContent =
    message;


  box.appendChild(
    el
  );


  setTimeout(()=>{

    el.remove();

  },3500);

}


/* =========================================================
   MODAL
   ========================================================= */

function openModal(
  title,
  html
){

  $("modalTitle")
    .textContent =
    title;


  $("modalBody")
    .innerHTML =
    html;


  $("modal")
    .classList
    .add("show");

}


function closeModal(){

  $("modal")
    .classList
    .remove("show");

}


/* =========================================================
   THEME
   ========================================================= */

function applyTheme(){

  const theme =
    localStorage.getItem(
      THEME_KEY
    ) ||
    "light";


  document.documentElement
    .setAttribute(
      "data-theme",
      theme
    );

}


function toggleTheme(){

  const current =
    document.documentElement
      .getAttribute(
        "data-theme"
      );


  const next =
    current === "dark"
      ? "light"
      : "dark";


  document.documentElement
    .setAttribute(
      "data-theme",
      next
    );


  localStorage.setItem(
    THEME_KEY,
    next
  );

}

/*
  The Firebase module normally
  finishes before this event is
  needed, but this also protects
  against loading timing issues.
*/

window.addEventListener(
  "load",
  async ()=>{

    try{

      await initializeFirestore();

    }catch(error){

      console.error(
        error
      );

    }


    router();

  }
);
